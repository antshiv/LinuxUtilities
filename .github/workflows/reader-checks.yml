name: Reader and documentation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reader protocol and documentation policy tests
        run: python3 -m unittest -v tests.test_cke_kokoro_reader tests.test_docs_policy
      - name: Documentation policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_docs_policy.py "$BASE_SHA"
      - name: Build published documentation
        run: bash docs/build.sh
